<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPM-101 Course Helpdesk</title>
<style>
  :root {
    --bg: #f4f5f9; --panel: #ffffff; --text: #1c2030; --muted: #667085; --line: #e2e5ee;
    --accent: #3b4cca; --accent-text: #ffffff; --user: #3b4cca; --user-text: #ffffff;
    --bot: #eef0f7; --err-bg: #fdecec; --err-text: #9b1c1c; --chip: #e7eafc; --ok: #1a7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --panel: #1b1e2a; --text: #e8eaf2; --muted: #98a0b5; --line: #2c3142;
      --accent: #7b8cff; --accent-text: #10131f; --user: #4452d6; --user-text: #ffffff;
      --bot: #262a3a; --err-bg: #3a1f22; --err-text: #ffb4b4; --chip: #2b3050; --ok: #5fd39a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .stats { display: flex; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; text-align: center; min-width: 92px; }
  .stat b { display: block; font-size: 18px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: var(--err-bg); color: var(--err-text); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; white-space: normal; }
  .pill { background: var(--chip); border-radius: 999px; padding: 1px 9px; color: var(--text); }
  .pill.cache { color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  .chips button { background: var(--chip); color: var(--text); border: 0; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chips button:hover { filter: brightness(0.95); }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: b 1.1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  form { display: flex; gap: 8px; align-items: flex-end; }
  .box { flex: 1; position: relative; }
  textarea { width: 100%; resize: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px; max-height: 140px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  #count { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--muted); pointer-events: none; }
  button.send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px; padding: 0 18px; height: 42px; font: inherit; font-weight: 600; cursor: pointer; min-width: 88px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button.send:disabled { opacity: .55; cursor: not-allowed; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .7s linear infinite; display: none; }
  .busy .spin { display: inline-block; }
  @keyframes r { to { transform: rotate(360deg); } }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.ghost:disabled { opacity: .5; cursor: not-allowed; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) { .stat { min-width: 0; padding: 4px 8px; } .msg { max-width: 94%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>DPM-101 Course Helpdesk<small>Answers come only from the official course documents</small></h1>
    <div class="stats" aria-label="Live usage counters">
      <div class="stat"><b id="s-total">0</b><span>Total Questions</span></div>
      <div class="stat"><b id="s-api">0</b><span>Gemini API Calls</span></div>
      <div class="stat"><b id="s-cache">0</b><span>Served from Cache</span></div>
    </div>
  </header>

  <main id="log" aria-live="polite" aria-label="Conversation"></main>

  <form id="form" autocomplete="off">
    <div class="box">
      <textarea id="input" rows="1" maxlength="500" placeholder="Ask about grading, deadlines, exams, fees…" aria-label="Your question"></textarea>
      <span id="count">0/500</span>
    </div>
    <button class="send" id="send" type="submit"><span class="spin" aria-hidden="true"></span><span id="send-label">Send</span></button>
  </form>

  <footer>
    <span>Not covered in the documents? I'll say so instead of guessing.</span>
    <button class="ghost" id="new" type="button">New chat</button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), input = $("input"), sendBtn = $("send"), label = $("send-label"), form = $("form");
  var SAMPLES = [
    "What score do I need to pass?",
    "When is the capstone due?",
    "Is the final exam open-book?",
    "How much does the Verified track cost?"
  ];
  var sessionId = null, busy = false, lockUntil = 0, lockTimer = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // textContent only: never inject HTML
    return e;
  }
  function scroll() { log.scrollTop = log.scrollHeight; }

  function welcome() {
    var m = el("div", "msg bot", "Hi! I'm the DPM-101 helpdesk. Ask me about grading, deadlines, exams or fees. Try one of these:");
    var chips = el("div", "chips");
    SAMPLES.forEach(function (q) {
      var b = el("button", null, q); b.type = "button";
      b.addEventListener("click", function () { input.value = q; updateCount(); send(); });
      chips.appendChild(b);
    });
    m.appendChild(chips); m.id = "welcome";
    log.appendChild(m);
  }

  function addUser(text) { var m = el("div", "msg user", text); log.appendChild(m); scroll(); }
  function addError(text) { var m = el("div", "msg error", text); log.appendChild(m); scroll(); }
  function addTyping() {
    var m = el("div", "msg bot"); var d = el("span", "dots");
    d.setAttribute("aria-label", "Thinking");
    d.innerHTML = "<span></span><span></span><span></span>";   // static markup, no user data
    m.appendChild(d); log.appendChild(m); scroll(); return m;
  }
  function addAnswer(d) {
    var m = el("div", "msg bot", d.answer);
    var meta = el("div", "meta");
    (d.sources || []).forEach(function (s) { meta.appendChild(el("span", "pill", "Source: " + s)); });
    if (d.cached) meta.appendChild(el("span", "pill cache", d.via === "coalesced" ? "shared answer (no extra API call)" : "from cache"));
    if (meta.childNodes.length) m.appendChild(meta);
    log.appendChild(m); scroll();
  }

  function renderStats(s) {
    if (!s) return;
    $("s-total").textContent = s.total_questions;
    $("s-api").textContent = s.api_calls;
    $("s-cache").textContent = s.cache_hits;
  }
  function refreshStats() {
    if (document.hidden) return;
    fetch("/api/stats", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(renderStats)
      .catch(function () {});
  }

  function updateCount() {
    $("count").textContent = input.value.length + "/500";
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  function locked() { return Date.now() < lockUntil; }
  function setUI() {
    var wait = locked();
    sendBtn.disabled = busy || wait;
    sendBtn.classList.toggle("busy", busy);
    $("new").disabled = busy;
    label.textContent = busy ? "Sending" : wait ? "Wait " + Math.ceil((lockUntil - Date.now()) / 1000) + "s" : "Send";
  }
  function lock(seconds) {
    lockUntil = Date.now() + seconds * 1000;
    clearInterval(lockTimer);
    lockTimer = setInterval(function () { if (!locked()) clearInterval(lockTimer); setUI(); }, 500);
    setUI();
  }

  function friendly(status) {
    if (status === 429) return "Too many requests right now. Please wait a moment and try again.";
    if (status >= 500) return "The helpdesk is temporarily unavailable (it may be waking up). Please try again in a few seconds.";
    return "Something went wrong. Please try again.";
  }

  async function send() {
    if (busy || locked()) return;                 // blocks double-clicks / Enter spam (synchronous guard)
    var text = input.value.trim();
    if (!text) return;
    busy = true; setUI();
    var w = $("welcome"); if (w) w.remove();
    addUser(text);
    input.value = ""; updateCount();
    var typing = addTyping();
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 60000);
    var failed = false;
    try {
      var res = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }), signal: ctl.signal
      });
      var data = null;
      try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
      if (res.ok && data && data.answer != null) {
        sessionId = data.session_id;
        typing.remove(); typing = null;
        addAnswer(data); renderStats(data.stats);
      } else {
        failed = true;
        typing.remove(); typing = null;
        addError((data && data.message) || friendly(res.status));
        var ra = parseInt(res.headers.get("Retry-After"), 10);
        if (res.status === 429 && ra > 0) lock(Math.min(ra, 60));
      }
    } catch (e) {
      failed = true;
      if (typing) typing.remove();
      addError(e && e.name === "AbortError"
        ? "That took too long. Please try again."
        : "Couldn't reach the helpdesk. Check your connection and try again.");
    } finally {
      clearTimeout(t);
      busy = false; setUI();
      if (failed && !input.value) { input.value = text; updateCount(); }   // let the student retry without retyping
      refreshStats();
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); send(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", updateCount);
  $("new").addEventListener("click", function () {
    if (busy) return;
    sessionId = null; log.innerHTML = ""; welcome(); input.focus();
  });

  welcome(); updateCount(); setUI(); refreshStats();
  setInterval(refreshStats, 5000);
  document.addEventListener("visibilitychange", refreshStats);
})();
</script>
</body>
</html>
